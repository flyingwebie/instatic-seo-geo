name: Validate and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR builds can stop; main commits and version tags keep their own runs.
# Pushes to main publish the package.json version as the Latest release when
# that version has not been released yet; other pushes only build and test.
concurrency:
  group: release-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.2
  INSTATIC_REF: 9314b201268baffc74de35dd149688964d666f39

jobs:
  validate:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Instatic-plugins/seo-geo
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Instatic-plugins/seo-geo
          fetch-depth: 0
          persist-credentials: false

      - name: Verify version tag points to main history
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            printf 'Version tags must point to a commit already merged into main.\n' >&2
            exit 1
          fi

      - name: Check out pinned Instatic SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flyingwebie/Instatic
          ref: ${{ env.INSTATIC_REF }}
          path: Instatic
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes zip unzip

      - name: Install host dependencies
        working-directory: Instatic
        run: bun install --frozen-lockfile

      - name: Install plugin dependencies
        run: bun install --frozen-lockfile

      - name: Prepare release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          package_version="$(jq -r .version package.json)"
          channel="$(bun run scripts/release-version.ts channel)"
          version_tag=""
          publish=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # A hand-pushed version tag publishes that exact version.
            version_tag="$GITHUB_REF_NAME"
            publish=true
          elif [ "$GITHUB_REF" = "refs/heads/main" ] && { [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; }; then
            # On main, release the package version once: only if its tag is new.
            candidate="v$package_version"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$candidate" > /dev/null 2> lookup-error.txt; then
              printf 'Version %s is already released; this run only builds and tests.\n' "$candidate"
            elif grep -q 'HTTP 404' lookup-error.txt; then
              printf 'New version %s: it will be published as the latest release.\n' "$candidate"
              version_tag="$candidate"
              publish=true
            else
              printf 'Could not check whether tag %s exists:\n' "$candidate" >&2
              cat lookup-error.txt >&2
              exit 1
            fi
          fi
          release_version="$(bun run scripts/release-version.ts "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$version_tag")"
          printf 'version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$release_version" >> "$GITHUB_OUTPUT"
          printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"
          printf 'publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"
          printf 'INSTATIC_PLUGIN_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"
          printf 'RELEASE_CHANNEL=%s\n' "$channel" >> "$GITHUB_ENV"

      - name: Lint plugin
        run: bun run lint

      - name: Test plugin behavior and release identity
        run: bun run test

      - name: Typecheck and build plugin ZIP
        run: bun run build

      - name: Verify built plugin in QuickJS
        run: bun run verify:sandbox

      - name: Verify archive and record build inputs
        run: |
          unzip -t artifacts/seo-geo.plugin.zip
          bun --eval 'await Bun.write("artifacts/build-info.json", JSON.stringify({ unofficial: true, channel: process.env.RELEASE_CHANNEL, version: process.env.INSTATIC_PLUGIN_VERSION, pluginCommit: process.env.GITHUB_SHA, instaticCommit: process.env.INSTATIC_REF, bunVersion: Bun.version }, null, 2) + "\n")'
          # The CHANGELOG section for this version becomes the top of the release notes.
          awk -v heading="## [$INSTATIC_PLUGIN_VERSION]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > artifacts/changes.md || true
          cd artifacts
          sha256sum seo-geo.plugin.zip build-info.json > SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seo-geo-${{ steps.version.outputs.version }}
          path: Instatic-plugins/seo-geo/artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
    steps:
      - name: Download validated package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seo-geo-${{ needs.validate.outputs.version }}
          path: artifacts

      - name: Verify downloaded files
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS

      - name: Write release notes
        run: |
          case "$RELEASE_CHANNEL" in
            stable) stage="a stable release" ;;
            rc) stage="a release candidate" ;;
            *) stage="in $RELEASE_CHANNEL testing" ;;
          esac
          kind="Release $RELEASE_TAG"
          {
            if [ -s artifacts/changes.md ]; then
              printf "## What's new in %s\n" "$RELEASE_TAG"
              cat artifacts/changes.md
              printf '\n'
            fi
          } > release-notes.md
          cat >> release-notes.md <<EOF
          ## $kind

          **This plugin is NOT official.** It is independently maintained and is $stage.
          Consult the README for current implementation status and limits.

          - Plugin version: \`$RELEASE_VERSION\`
          - Source commit: \`$GITHUB_SHA\`
          - Instatic SDK commit: \`$INSTATIC_REF\`
          - Bun: \`$BUN_VERSION\`
          - [Workflow run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          - [README](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/README.md)

          ### Install the ZIP

          **Update Instatic first:** the running server and admin build must include the publication SDK and permissions from [host PR #8](https://github.com/flyingwebie/Instatic/pull/8), and the PostgreSQL plugin storage fix from [host PR #12](https://github.com/flyingwebie/Instatic/pull/12), both merged into host main. This release is validated against host commit \`$INSTATIC_REF\`. Update/rebuild and restart or redeploy existing installations, then reload the admin page before uploading.

          Docker/Coolify deployments can use the fork-specific \`docker-compose.coolify.flyingwebie.yml\` template from [host PR #9](https://github.com/flyingwebie/Instatic/pull/9), which pulls \`ghcr.io/flyingwebie/instatic:latest\`. Publish a fresh fork core release containing the required SDK and storage changes, update any existing \`INSTATIC_IMAGE\` override, and pull/restart in Coolify. A merge into host main alone does not update the published image.

          An older host rejects \`cms.routes.site\` and \`cms.publication.read\` with \`Invalid plugin manifest: Expected union value\`. See the [installation requirements](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/README.md#update-instatic-before-uploading).

          1. Download \`seo-geo.plugin.zip\` from this release.
          2. Open Instatic **Admin → Plugins** and upload the ZIP.
          3. Review and approve the declared permissions, then confirm installation. Instatic installs and activates the plugin.
          4. Open the plugin app, set the public website origin, and generate the first export.

          \`SHA256SUMS\` verifies the package and \`build-info.json\` records its build inputs.
          EOF

      - name: Publish release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            printf 'Release %s is already published; preserving its assets.\n' "$RELEASE_TAG"
            exit 0
          fi
          title="SEO, GEO & AIO $RELEASE_TAG"
          case "$RELEASE_CHANNEL" in
            stable) ;;
            rc) title="$title (release candidate)" ;;
            *) title="$title ($RELEASE_CHANNEL)" ;;
          esac
          # Every new version becomes the repository's Latest release, so the
          # newest ZIP is always the one shown in the Releases sidebar.
          gh release create "$RELEASE_TAG" \
            artifacts/seo-geo.plugin.zip artifacts/SHA256SUMS artifacts/build-info.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --latest \
            --notes-file release-notes.md
