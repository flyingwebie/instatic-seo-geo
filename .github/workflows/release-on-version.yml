name: Release on version change

# When a merge to main changes the version in package.json, publish that
# version as a GitHub release (tag "v" + version) with the validated ZIP.
# Releasing is idempotent: an existing tag or release is never replaced.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-on-version-${{ github.sha }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect a new package version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whether the version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version package.json)"
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$'; then
            printf 'package.json version "%s" is not a releasable version such as 1.0.0 or 1.0.0-beta.0.\n' "$version" >&2
            exit 1
          fi
          tag="v$version"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2> lookup-error.txt; then
            printf 'Tag %s already exists; nothing to release.\n' "$tag"
            printf 'release=false\n' >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' lookup-error.txt; then
            printf 'Releasing %s.\n' "$tag"
            printf 'release=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'Could not check whether tag %s exists:\n' "$tag" >&2
            cat lookup-error.txt >&2
            exit 1
          fi

  release:
    name: Validate and publish
    needs: detect
    if: needs.detect.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/ci-release.yml
    with:
      version-tag: ${{ needs.detect.outputs.tag }}
